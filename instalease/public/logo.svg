<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient background circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Installment bars (representing payment schedule) -->
  <g transform="translate(50, 60)">
    <!-- Bar 1 - Completed -->
    <rect x="0" y="0" width="18" height="60" rx="4" fill="#10B981" opacity="0.9">
      <animate attributeName="height" from="0" to="60" dur="0.6s" fill="freeze"/>
    </rect>
    <!-- Bar 2 - Completed -->
    <rect x="26" y="10" width="18" height="50" rx="4" fill="#10B981" opacity="0.8">
      <animate attributeName="height" from="0" to="50" dur="0.7s" fill="freeze"/>
    </rect>
    <!-- Bar 3 - In Progress -->
    <rect x="52" y="20" width="18" height="40" rx="4" fill="#FBBF24" opacity="0.9">
      <animate attributeName="height" from="0" to="40" dur="0.8s" fill="freeze"/>
    </rect>
    <!-- Bar 4 - Pending -->
    <rect x="78" y="30" width="18" height="30" rx="4" fill="#E5E7EB" opacity="0.6">
      <animate attributeName="height" from="0" to="30" dur="0.9s" fill="freeze"/>
    </rect>
  </g>
  
  <!-- Checkmark icon (success symbol) -->
  <g transform="translate(130, 120)">
    <circle cx="15" cy="15" r="15" fill="url(#accentGradient)">
      <animate attributeName="r" from="0" to="15" dur="0.5s" begin="0.8s" fill="freeze"/>
    </circle>
    <path d="M 8 15 L 13 20 L 22 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1s" fill="freeze"/>
    </path>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="4" fill="#FBBF24" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="40" r="3" fill="#10B981" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="170" r="5" fill="#7C3AED" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
